services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rehab}
      POSTGRES_USER: ${POSTGRES_USER:-rehab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      REHAB_DATABASE_URL: ${REHAB_DATABASE_URL:?Set REHAB_DATABASE_URL}
      REHAB_JWT_SECRET: ${REHAB_JWT_SECRET:?Set REHAB_JWT_SECRET}
      REHAB_AUTO_CREATE_SCHEMA: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
