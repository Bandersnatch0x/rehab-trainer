[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rehab-trainer-api"
version = "0.1.0"
description = "rehab-trainer 后端 API（FastAPI + SQLAlchemy 2.x）"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "pyjwt>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  # tests/test_contract.py 直接读 openapi.yaml，不能靠传递依赖。
  "pyyaml>=6.0,<7.0",
]
postgres = [
  "psycopg[binary]>=3.2,<4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
