      dtype: string
      unit: null
      missing_codes: [unknown]
      sensitivity: high
      export_default: excluded
      d23_status: allowed
      derivation: >-
        分界值待临床签核（C4）；签核前本系统不写入该列，科研输出不得使用。

  prescription:
    - table: prescription
      field: patient_id
      label_zh: 处方患者
      dtype: string
