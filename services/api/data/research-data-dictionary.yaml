    - table: prescription
      field: version
      label_zh: 处方版本
      dtype: string
      unit: null
      missing_codes: [not-applicable]
      sensitivity: low
      export_default: in-aggregate
      d23_status: allowed
      derivation: direct
    - table: prescription
      field: mapping_table_version
      label_zh: 映射表版本
      dtype: string
      unit: null
      missing_codes: [not-applicable]
      sensitivity: low
      export_default: in-aggregate
      d23_status: allowed
      derivation: direct
    - table: prescription
      field: issued_at
      label_zh: 开具时间
      dtype: datetime
      unit: iso-8601
      missing_codes: [not-applicable]
      sensitivity: medium
      export_default: in-aggregate
      d23_status: allowed
      derivation: direct
    - table: prescription
      field: valid_from
      label_zh: 生效时间
      dtype: datetime
      unit: iso-8601
      missing_codes: [not-applicable]
      sensitivity: medium
      export_default: in-aggregate
