openapi: 3.1.0
info:
  title: rehab-trainer API
  version: 0.1.0
  description: |
    契约唯一真源。Android、微信小程序、管理端均从本文件生成客户端，不手写跨端类型。

    约定：
    - 所有资源访问按调用者的 org 隔离；跨机构访问返回 403 并写审计。
    - 角色：patient / caregiver / care_admin / rehab_therapist。
    - 训练记录批量上传幂等，以 clientRecordId 去重。
    - 处方更新使用版本号做乐观锁。

    本版本只覆盖核心链路：患者、评估、分级确认、处方、训练条目、训练记录、预警。
    以下端点留待后续版本，不在此文件中：
    - 微信绑定与代操作（未决项 3）
    - 内容清单与签名 URL（未决项 8/9/10）
    - 用药-训练协同（未决项 5）
    - 审计导出（未决项 6 之后）
servers:
  - url: https://api.rehab-trainer.local/v1
    description: 占位地址，部署时替换
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: patients
  - name: assessments
  - name: prescriptions
  - name: exercises
  - name: sessions
  - name: alerts
  - name: audit
  - name: research
  - name: media
  - name: accounts

paths:
  /auth/bind:
    post:
      tags: [auth]
      summary: 用一次性绑定码换取访问令牌
      description: |
        绑定码由管理端生成，短时有效、一次性使用。
        本端点不依赖微信 openid；openid 只作为可撤销凭据另行绑定（后续版本）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bindingToken]
              properties:
                bindingToken:
                  type: string
                  description: 一次性绑定码
                deviceId:
                  type: string
                  description: 设备标识，用于建立设备会话
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 绑定码已使用或已过期

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    post:
      tags: [auth]
      summary: 内部账号登录
      description: |
        管理端与治疗师工作台使用内部账号 + 密码登录，不依赖微信。
        启用二次验证的账号需额外提交 totp。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，令牌与账号档案一次返回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: 尝试次数过多，已限流

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /me:
    get:
      tags: [auth]
      summary: 当前账号信息
      description: |
        返回账号、角色与所属机构。前端据此决定菜单可见性与数据范围；
        不得用前端隐藏代替后端 org 隔离。
      responses:
        "200":
          description: 当前账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /patients:
    get:
      tags: [patients]
      summary: 列出当前机构下的患者
      description: 照护管理员与治疗师可见全部；患者与照护者只能看到自己关联的患者。
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: stage
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PatientStatus"
      responses:
        "200":
          description: 患者列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [patients]
      summary: 新建患者档案
      description: 仅 care_admin 与 rehab_therapist。新建后分级状态为 suspected。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientCreate"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /patients/{patientId}:
    get:
      tags: [patients]
      summary: 获取患者详情
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: 患者详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /patients/{patientId}/stage-confirmations:
    post:
      tags: [assessments]
      summary: 康复治疗师确认 H-Y 分级
      description: 仅 rehab_therapist。确认后患者分级状态变为 confirmed，才可用于高风险训练准入。
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, confirmedAt]
              properties:
                stage:
                  type: integer
                  minimum: 1
                  maximum: 5
                confirmedAt:
                  type: string
                  format: date-time
                note:
                  type: string
      responses:
        "201":
          description: 已确认
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageConfirmation"
        "403":
          $ref: "#/components/responses/Forbidden"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /patients/{patientId}/assessments:
    get:
      tags: [assessments]
      summary: 列出患者的评估与身体感受记录
      description: |
        按评估时间倒序返回。管理端治疗师据此查看患者提交的每日身体感受（DAILY_FEELING）。
        量表分界值待临床签核，服务端不据此输出诊断结论。
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 评估记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentPage"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [assessments]
      summary: 提交一次评估
      description: |
        可提交 H-Y 自评、肌少症筛查、僵直自评、跌倒风险自评。
        量表分界值待临床签核，服务端不据此输出诊断结论。
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentCreate"
      responses:
        "201":
          description: 已提交
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
        "422":
          $ref: "#/components/responses/ValidationError"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /exercises:
    get:
      tags: [exercises]
      summary: 列出训练条目
      parameters:
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ExerciseCategory"
        - name: stage
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 训练条目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExercisePage"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /exercises/{code}:
    get:
      tags: [exercises]
      summary: 获取训练条目详情
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 训练条目
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercise"
        "404":
          $ref: "#/components/responses/NotFound"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /prescriptions:
    get:
      tags: [prescriptions]
      summary: 按患者读取处方
      description: 按签发时间倒序返回。第一条是最近签发的处方；是否仍然有效由客户端按 status 与 validUntil 判断，服务端不过滤。
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 处方列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [prescriptions]
      summary: 开具处方
      description: 仅 rehab_therapist。处方必须引用已发布的训练条目。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionCreate"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /prescriptions/{prescriptionId}:
    patch:
      tags: [prescriptions]
      summary: 调整处方
      description: |
        仅 rehab_therapist。使用 If-Match 传当前 version 做乐观锁；
        变更后生成新版本，旧版本保留可追溯。
      parameters:
        - name: prescriptionId
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            example: "1.0.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionPatch"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"
        "409":
          description: 版本冲突
        "403":
          $ref: "#/components/responses/Forbidden"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /sessions:
    post:
      tags: [sessions]
      summary: 批量上传训练记录
      description: |
        幂等：以 clientRecordId 去重，重复提交返回已存在记录。
        App 离线产生的记录联网后批量补传。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/SessionRecordCreate"
      responses:
        "200":
          description: 逐条接收结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBatchResult"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      tags: [sessions]
      summary: 查询训练记录
      parameters:
        - name: patientId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 训练记录列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRecordPage"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /alerts:
    get:
      tags: [alerts]
      summary: 查询预警事件
      parameters:
        - name: patientId
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            $ref: "#/components/schemas/AlertLevel"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, followed_up, closed]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 预警列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertPage"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /alerts/{alertId}:
    patch:
      tags: [alerts]
      summary: 标记预警处理结果
      description: 仅 care_admin 与 rehab_therapist。记录处理人与处理动作，形成随访台账。
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [acknowledged, followed_up, closed]
                note:
                  type: string
                  maxLength: 1024
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "403":
          $ref: "#/components/responses/Forbidden"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /audit-events:
    get:
      tags: [audit]
      summary: 查询本机构审计事件
      description: |
        仅 care_admin 与 rehab_therapist。按发生时间倒序返回本机构审计事件，
        供处理明细核验与导出；跨机构不可见。
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: actorAccountId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 审计事件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "403":
          $ref: "#/components/responses/Forbidden"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /research/overview:
    get:
      tags: [research]
      summary: 本机构科研聚合画像
      description: |
        仅 rehab_therapist 与 care_admin。只返回聚合值，不返回行级数据：
        - 计数 1–4 的单元格抑制为 `count: null` 且 `suppressed: true`；
        - 计数为 0 按真值公布，因为 0 不指向任何个体；
        - 若某分布只隐藏了 1 个单元格且总数已公开，会再抑制一个最小可见
          单元格（二次抑制），使被隐藏的值无法由总数相减反推；
        - 分子 1–4 的比例同样抑制，避免由精确比例反解出分子。
        不提供插值、区间或取整。默认只取 `data_origin = real` 的患者，
        年龄按分段输出，不返回出生年份原值。每次访问写审计
        `research.overview.viewed`。
      responses:
        "200":
          description: 聚合画像
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchOverview"
        "403":
          $ref: "#/components/responses/Forbidden"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /research/data-quality:
    get:
      tags: [research]
      summary: 本机构训练数据质量看板
      description: |
        仅 rehab_therapist 与 care_admin。只返回聚合值，n<5 抑制。
        版本分布按模型版本、指标算法版本与阈值配置版本分层，跨版本记录
        不得直接比较趋势。`is_doubtful` 为探索性变量：有效性阈值
        （未决项 12）尚未临床签核。每次访问写审计
        `research.data_quality.viewed`。
      responses:
        "200":
          description: 数据质量看板
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDataQuality"
        "403":
          $ref: "#/components/responses/Forbidden"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /media-assets:
    get:
      tags: [media]
      summary: 列出本机构的视频资产
      description: |
        仅 care_admin 与 rehab_therapist。按机构隔离，跨机构不可见。
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MediaAssetStatus"
        - name: exerciseCode
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 视频资产列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssetPage"
        "403":
          $ref: "#/components/responses/Forbidden"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /media-assets/upload:
    post:
      tags: [media]
      summary: 上传训练视频（multipart）
      description: |
        仅 care_admin 与 rehab_therapist。服务端只接受 MP4，按文件头魔数校验
        真实类型，不信任扩展名与 `Content-Type`；文件名由服务端生成
        （UUID + `.mp4`），客户端提供的文件名被忽略；落盘路径固定在配置的
        媒体静态根下，拒绝任何 `..` 或绝对路径；超过单文件上限返回 413。

        上传结果为 `draft`，需通过 PATCH 置为 `published` 才会下发。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: MP4 视频文件
                exerciseCode:
                  type: string
                  description: 关联训练条目；留空表示通用素材
                applicableStages:
                  type: string
                  description: 适用 H-Y 分级，逗号分隔，如 `1,2,3`；留空表示尚未裁决
                watermarkText:
                  type: string
                  description: 水印文字（客户端叠加显示，不烧录进文件）
                creditLine:
                  type: string
                  description: 来源署名
                note:
                  type: string
      responses:
        "201":
          description: 已上传的草稿资产
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /media-assets/{assetId}:
    patch:
      tags: [media]
      summary: 修改水印、署名、适用分级或上下架状态
      description: |
        状态置为 `published` 时要求已设置适用分级，否则返回 422；
        `published` / `retired` 变更写审计 `media.published` / `media.retired`。
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaAssetPatch"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /accounts:
    get:
      tags: [accounts]
      summary: 列出本机构账号
      description: |
        照护管理员与康复治疗师均可。按机构隔离，跨机构不可见；按创建时间倒序返回。
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AccountStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 账号列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "403":
          $ref: "#/components/responses/Forbidden"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [accounts]
      summary: 开通机构账号
      description: |
        照护管理员与康复治疗师均可。机构取登录账号所属机构，请求体不携带机构字段；
        用户名全局唯一；口令在服务端以 PBKDF2 哈希存储，响应体不含口令或哈希。
        **可授予的角色按调用者受限**：照护管理员可授予照护管理员与康复治疗师，
        康复治疗师只能授予康复治疗师——否则等于变相自升权（授予照护管理员即拿到
        分级确认与开方权）。越权授予返回 403 并写审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 用户名已存在
        "422":
          $ref: "#/components/responses/ValidationError"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /accounts/{accountId}:
    patch:
      tags: [accounts]
      summary: 修改账号名称、状态或角色
      description: |
        照护管理员与康复治疗师均可，但**目标账号与目标角色都必须在调用者可授予的范围内**：
        康复治疗师不能调整照护管理员账号，也不能把任何人提成照护管理员（403 并写审计）。
        跨机构返回 403 并写审计。不能禁用或降级自己，也不能移除本机构最后一个照护管理员。
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 违反机构管理员保留约束
        "422":
          $ref: "#/components/responses/ValidationError"

        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: |
        不透明游标，取自上一页的 `nextCursor`。服务端按排序键定位，
        翻页期间有新增或删除也不会重复或漏行。客户端不应解析其内容。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: 未认证或令牌失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 无权限或跨机构访问
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: 请求校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: >
        服务暂时不可用：数据库连接池已满或连接中断。属可重试状态，
        客户端应按退避重试而不是立即放弃；响应体 detail.retryable 为 true。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [FORBIDDEN, NOT_FOUND, VALIDATION_FAILED]
        message:
          type: string
        detail:
          type: object
          additionalProperties: true

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: 秒

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        totp:
          type: string
          description: 二次验证码；未启用 2FA 的账号省略

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [profile]
          properties:
            profile:
              $ref: "#/components/schemas/Me"

    Me:
      type: object
      required: [accountId, displayName, roles, orgId]
      properties:
        accountId:
          type: string
        displayName:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Role"
        orgId:
          type: string
        orgName:
          type: string

    PatientStatus:
      type: string
      enum: [active, inactive]

    StageConfirmationStatus:
      type: string
      enum: [confirmed, suspected]

    ExerciseCategory:
      type: string
      enum: [stretching-relaxation, strength-maintenance, rhythmic-gait, postural-correction]

    RiskLevel:
      type: string
      enum: [low, medium, high]

    AlertLevel:
      type: string
      enum: [info, warning, critical]

    Patient:
      type: object
      required: [id, orgId, displayName, hyStage, stageConfirmationStatus, status]
      properties:
        id:
          type: string
        orgId:
          type: string
        displayName:
          type: string
        birthYear:
          type: integer
        hyStage:
          type: integer
          minimum: 1
          maximum: 5
        stageConfirmationStatus:
          $ref: "#/components/schemas/StageConfirmationStatus"
        stageConfirmedBy:
          type: string
          nullable: true
        stageConfirmedAt:
          type: string
          format: date-time
          nullable: true
        fallRisk:
          $ref: "#/components/schemas/RiskLevel"
        symptoms:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/PatientStatus"
        createdAt:
          type: string
          format: date-time

    PatientCreate:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        birthYear:
          type: integer
          minimum: 1900
          maximum: 2100
        note:
          type: string

    PatientPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        nextCursor:
          type: string
          nullable: true

    StageConfirmation:
      type: object
      required: [patientId, stage, status, confirmedBy, confirmedAt]
      properties:
        patientId:
          type: string
        stage:
          type: integer
          minimum: 1
          maximum: 5
        status:
          $ref: "#/components/schemas/StageConfirmationStatus"
        confirmedBy:
          type: string
        confirmedAt:
          type: string
          format: date-time
        note:
          type: string

    AssessmentCreate:
      type: object
      required: [instrument, assessedAt]
      properties:
        instrument:
          type: string
          description: 量表编码，如 HY_SELF / SARC_F / SARC_CALF / RIGIDITY_5 / STEADI / FES_I
        score:
          type: number
        answers:
          type: object
          maxProperties: 32
          additionalProperties:
            type: [string, number, boolean, "null"]
          description: |
            结构化答案。值只能是标量；单条文本不超过 1000 字，
            序列化后总长度不超过 4 KB（服务端校验）。
        assessedAt:
          type: string
          format: date-time
        assessedBy:
          type: string
          description: 操作者账号；代操作时与 subject 不同

    Assessment:
      type: object
      required: [id, patientId, instrument, assessedAt, assessedBy]
      properties:
        id:
          type: string
        patientId:
          type: string
        instrument:
          type: string
        score:
          type: number
        answers:
          type: object
          additionalProperties: true
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        assessedAt:
          type: string
          format: date-time
        assessedBy:
          type: string

    AssessmentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"
        nextCursor:
          type: string
          nullable: true

    Dosage:
      type: object
      properties:
        sets:
          type: integer
          minimum: 0
          maximum: 50
        repetitions:
          type: integer
          minimum: 0
          maximum: 500
        bpm:
          type: integer
          minimum: 0
          maximum: 240
          description: 节拍；个体化规则待临床签核
        durationMinutes:
          type: number
          minimum: 0
          maximum: 600
        frequencyPerWeek:
          type: integer
          minimum: 0
          maximum: 14
        restSeconds:
          type: integer
          minimum: 0
          maximum: 3600

    ExerciseVariant:
      type: object
      required: [code, level]
      properties:
        code:
          type: string
        level:
          type: integer
        supportLevel:
          type: string
          enum: [unsupported-standing, supported-standing, seated]
        applicableStages:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
        defaultDosage:
          $ref: "#/components/schemas/Dosage"

    Exercise:
      type: object
      required: [code, label, category, publicationStatus]
      properties:
        code:
          type: string
        label:
          type: string
        category:
          $ref: "#/components/schemas/ExerciseCategory"
        publicationStatus:
          type: string
          enum: [draft, published, retired]
        riskLevel:
          $ref: "#/components/schemas/RiskLevel"
        applicableStages:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
        bodyParts:
          type: array
          items:
            type: string
        joints:
          type: array
          items:
            type: string
        contraindications:
          type: array
          items:
            type: string
          description: 至少一条，待临床签核
        dangerSignals:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseVariant"
        defaultDosage:
          $ref: "#/components/schemas/Dosage"
        videoUri:
          type: string
          format: uri
          description: 服务端按患者 H-Y 分级挑选的已上架视频；无匹配时不下发。
        audioUri:
          type: string
          format: uri
        videoCreditLine:
          type: string
          description: 视频来源署名，播放时展示。
        videoWatermarkText:
          type: string
          description: 水印文字，客户端以叠加层显示，不烧录进文件。

    ExercisePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Exercise"
        nextCursor:
          type: string
          nullable: true

    MediaAssetStatus:
      type: string
      enum: [draft, published, retired]

    MediaAsset:
      type: object
      required:
        - id
        - publicUrl
        - contentType
        - sizeBytes
        - sha256
        - status
        - applicableStages
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        exerciseCode:
          type: string
          nullable: true
          description: 为空表示通用素材。
        publicUrl:
          type: string
          format: uri
          description: 拼装后的可访问地址，仅由服务端生成。
        contentType:
          type: string
          description: 服务端按魔数认定的类型，恒为 video/mp4。
        sizeBytes:
          type: integer
        sha256:
          type: string
          description: 文件摘要，用于去重与完整性校验。
        watermarkText:
          type: string
          nullable: true
          description: 水印文字，客户端叠加显示，不烧录进文件。
        creditLine:
          type: string
          nullable: true
          description: 来源署名。
        status:
          $ref: "#/components/schemas/MediaAssetStatus"
        applicableStages:
          type: array
          description: 适用 H-Y 分级；空数组表示尚未裁决，不下发。
          items:
            type: integer
            minimum: 1
            maximum: 5
        publishedAt:
          type: string
          format: date-time
          nullable: true
        retiredAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaAssetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaAsset"
        nextCursor:
          type: string
          nullable: true

    MediaAssetPatch:
      type: object
      properties:
        watermarkText:
          type: string
          maxLength: 128
        creditLine:
          type: string
          maxLength: 255
        applicableStages:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
        status:
          $ref: "#/components/schemas/MediaAssetStatus"
        note:
          type: string

    PrescriptionItem:
      type: object
      required: [exerciseCode]
      properties:
        exerciseCode:
          type: string
        variantCode:
          type: string
        dosage:
          $ref: "#/components/schemas/Dosage"

    PrescriptionCreate:
      type: object
      required: [patientId, items, issuedAt, validFrom, validUntil, mappingTableVersion]
      properties:
        patientId:
          type: string
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/PrescriptionItem"
        issuedAt:
          type: string
          format: date-time
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        mappingTableVersion:
          type: string
          description: 分级→条目映射表版本，用于回溯

    PrescriptionPatch:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/PrescriptionItem"
        validUntil:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 1024

    Prescription:
      type: object
      required: [id, patientId, prescribedBy, items, issuedAt, version, status]
      properties:
        id:
          type: string
        patientId:
          type: string
        prescribedBy:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PrescriptionItem"
        issuedAt:
          type: string
          format: date-time
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        version:
          type: string
          description: 乐观锁版本
        mappingTableVersion:
          type: string
        status:
          type: string
          enum: [draft, active, expired]

    PrescriptionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Prescription"
        nextCursor:
          type: string
          nullable: true

    SessionRecordCreate:
      type: object
      required:
        - clientRecordId
        - patientId
        - prescriptionId
        - recordedAt
        - modelVersion
        - modelSha256
        - metricAlgorithmVersion
        - thresholdConfigVersion
      properties:
        clientRecordId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
          description: |
            客户端生成的幂等键，仅允许字母、数字与 `.` `_` `:` `-`；
            重试与补传必须复用同一个值。
        patientId:
          type: string
        prescriptionId:
          type: string
        recordedAt:
          type: string
          format: date-time
        recordedBy:
          type: string
          description: 操作者账号；代操作时与 subject 不同
        checkedIn:
          type: boolean
        completionCount:
          type: integer
        movementErrorCount:
          type: integer
        interruptionCount:
          type: integer
        validFrameRatio:
          type: number
          minimum: 0
          maximum: 1
        isDoubtful:
          type: boolean
          description: 有效性校验未通过时标记，不阻断打卡
        modelVersion:
          type: string
        modelSha256:
          type: string
        metricAlgorithmVersion:
          type: string
        thresholdConfigVersion:
          type: string
        metrics:
          type: object
          additionalProperties: true
          description: 步态指标、关节角等；口径约束见决策记录

    SessionBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [clientRecordId, accepted]
            properties:
              clientRecordId:
                type: string
              accepted:
                type: boolean
              recordId:
                type: string
              error:
                $ref: "#/components/schemas/Error"

    SessionRecord:
      type: object
      properties:
        id:
          type: string
        clientRecordId:
          type: string
        patientId:
          type: string
        prescriptionId:
          type: string
        recordedAt:
          type: string
          format: date-time
        checkedIn:
          type: boolean
        completionCount:
          type: integer
        movementErrorCount:
          type: integer
        interruptionCount:
          type: integer
        validFrameRatio:
          type: number
        isDoubtful:
          type: boolean
        modelVersion:
          type: string
        metricAlgorithmVersion:
          type: string
        thresholdConfigVersion:
          type: string

    SessionRecordPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionRecord"
        nextCursor:
          type: string
          nullable: true

    NotificationDelivery:
      type: object
      required: [channel, status, deliveredAt]
      properties:
        channel:
          type: string
          enum: [in_app_popup, voice_prompt, push_notification, audit_log]
        status:
          type: string
          enum: [pending, sent, failed, fallback]
        deliveredAt:
          type: string
          format: date-time

    Alert:
      type: object
      required: [id, patientId, ruleCode, level, triggeredAt, status]
      properties:
        id:
          type: string
        patientId:
          type: string
        ruleCode:
          type: string
        level:
          $ref: "#/components/schemas/AlertLevel"
        triggeredAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [open, acknowledged, followed_up, closed]
        handledBy:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDelivery"

    AlertPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        nextCursor:
          type: string
          nullable: true

    AuditEvent:
      type: object
      required: [id, action, outcome, createdAt]
      properties:
        id:
          type: string
        actorAccountId:
          type: string
          nullable: true
        action:
          type: string
        resourceType:
          type: string
          nullable: true
        resourceId:
          type: string
          nullable: true
        outcome:
          type: string
        detail:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    AuditEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: string
          nullable: true

    CountCell:
      type: object
      required: [suppressed]
      description: |
        聚合计数单元格。`count` 为 null 且 `suppressed` 为 true 表示
        样本数小于 5，已抑制；不得由其他字段反推该值。
      properties:
        count:
          type: integer
          nullable: true
        suppressed:
          type: boolean

    RateCell:
      type: object
      required: [suppressed]
      description: |
        聚合比例单元格。分母小于 5 时抑制为 `value: null`。
      properties:
        value:
          type: number
          nullable: true
        suppressed:
          type: boolean

    ResearchBucket:
      type: object
      required: [key, suppressed]
      properties:
        key:
          type: string
        count:
          type: integer
          nullable: true
        suppressed:
          type: boolean

    ResearchVersionBucket:
      type: object
      required: [key, count, suppressed]
      description: 版本分层计数；不足 5 条的版本不列出。
      properties:
        key:
          type: string
        count:
          type: integer
          nullable: true
        suppressed:
          type: boolean

    ResearchOverview:
      type: object
      required:
        [orgId, generatedAt, dataOrigin, minCellCount, patientCount,
         hyStageDistribution, stageConfirmationDistribution, ageDistribution]
      properties:
        orgId:
          type: string
        generatedAt:
          type: string
          format: date-time
        dataOrigin:
          type: string
          enum: [real]
          description: 科研输出只接受真实数据；demo 数据在查询层硬过滤。
        minCellCount:
          type: integer
          description: 小样本抑制阈值，当前为 5。
        patientCount:
          $ref: "#/components/schemas/CountCell"
        hyStageDistribution:
          type: array
          description: 键为 H-Y 分级 "1"–"5"。
          items:
            $ref: "#/components/schemas/ResearchBucket"
        stageConfirmationDistribution:
          type: array
          description: 键为 confirmed / suspected。
          items:
            $ref: "#/components/schemas/ResearchBucket"
        ageDistribution:
          type: array
          description: |
            年龄分段：under-60 / 60-69 / 70-79 / 80-plus / unknown。
            不返回出生年份原值。
          items:
            $ref: "#/components/schemas/ResearchBucket"

    ResearchDataQuality:
      type: object
      required:
        [orgId, generatedAt, dataOrigin, minCellCount, sessionRecordCount,
         validFrameRatioDistribution, doubtfulRatio, missingRatio,
         modelVersionDistribution, metricAlgorithmVersionDistribution,
         thresholdConfigVersionDistribution, note]
      properties:
        orgId:
          type: string
        generatedAt:
          type: string
          format: date-time
        dataOrigin:
          type: string
          enum: [real]
        minCellCount:
          type: integer
        sessionRecordCount:
          $ref: "#/components/schemas/CountCell"
        validFrameRatioDistribution:
          type: array
          description: 键为 missing / lt-0.5 / 0.5-0.8 / gte-0.8。
          items:
            $ref: "#/components/schemas/ResearchBucket"
        doubtfulRatio:
          $ref: "#/components/schemas/RateCell"
        missingRatio:
          $ref: "#/components/schemas/RateCell"
        modelVersionDistribution:
          type: array
          items:
            $ref: "#/components/schemas/ResearchVersionBucket"
        metricAlgorithmVersionDistribution:
          type: array
          items:
            $ref: "#/components/schemas/ResearchVersionBucket"
        thresholdConfigVersionDistribution:
          type: array
          items:
            $ref: "#/components/schemas/ResearchVersionBucket"
        note:
          type: string
          description: 探索性变量说明；有效性阈值尚未临床签核。

    Role:
      type: string
      enum: [patient, caregiver, care_admin, rehab_therapist]

    AccountStatus:
      type: string
      enum: [active, disabled]

    Account:
      type: object
      required: [accountId, displayName, status, roles, createdAt]
      properties:
        accountId:
          type: string
        displayName:
          type: string
        username:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/AccountStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    AccountPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        nextCursor:
          type: string
          nullable: true

    AccountCreate:
      type: object
      required: [displayName, username, password, role]
      properties:
        displayName:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [care_admin, rehab_therapist]

    AccountPatch:
      type: object
      properties:
        displayName:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        role:
          type: string
          enum: [care_admin, rehab_therapist]
