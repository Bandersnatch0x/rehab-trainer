# GitHub Actions CI。远端为 github.com 私有仓，已在真实流水线跑通。
# 手动触发（workflow_dispatch）用于「改完 CI 配置要全量验一遍」——路径过滤会把没碰到的 job 跳过，
# 那种情况下 android 这类重 job 可能几轮都没被真正执行过。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # 手动触发时 filter 那步不跑（输出为空），回落到 all —— 视为全量变更。
      android: ${{ steps.filter.outputs.android || steps.all.outputs.android }}
      miniprogram: ${{ steps.filter.outputs.miniprogram || steps.all.outputs.miniprogram }}
      admin_web: ${{ steps.filter.outputs.admin_web || steps.all.outputs.admin_web }}
      api: ${{ steps.filter.outputs.api || steps.all.outputs.api }}
      api_contract: ${{ steps.filter.outputs.api_contract || steps.all.outputs.api_contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            android:
              - 'apps/android/**'
            miniprogram:
              - 'apps/miniprogram/**'
            admin_web:
              - 'apps/admin-web/**'
            api:
              - 'services/api/**'
              - 'packages/api-contract/**'
              - 'scripts/**'
            api_contract:
              - 'packages/api-contract/**'
              - 'packages/api-client-ts/**'
              - 'packages/api-client-kt/**'
      - name: 手动触发视为全量变更
        id: all
        if: github.event_name == 'workflow_dispatch'
        run: |
          for key in android miniprogram admin_web api api_contract; do
            echo "$key=true" >> "$GITHUB_OUTPUT"
          done

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 默认 packages 含 legacy 的 `tools`，它在现代 SDK 仓库里已不存在，会让这一步 exit 1；
      # 只留 platform-tools，需要什么再用 sdkmanager 显式装。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - run: ./gradlew :app:testDebugUnitTest --no-daemon

  miniprogram:
    needs: changes
    if: needs.changes.outputs.miniprogram == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @rehab-trainer/miniprogram typecheck
      - run: pnpm --filter @rehab-trainer/miniprogram test
      - name: 小程序静态一致性（页面/绑定/D20）
        working-directory: apps/miniprogram
        run: python tests/static_check.py .

  admin-web:
    needs: changes
    if: needs.changes.outputs.admin_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @rehab-trainer/admin-web build

  generated:
    # 只改契约时也必须跑：否则两份生成物会静默漂移。
    needs: changes
    if: >-
      needs.changes.outputs.api_contract == 'true' ||
      needs.changes.outputs.admin_web == 'true' ||
      needs.changes.outputs.miniprogram == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: 生成物必须与契约一致
        run: |
          pnpm --filter @rehab-trainer/admin-web generate:api
          pnpm --filter @rehab-trainer/miniprogram generate:api
          git diff --exit-code -- apps/admin-web/src/api/schema.d.ts apps/miniprogram/types/api.d.ts

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # postgres extra 也要装：test_database_pool 会构造 postgres 方言引擎，缺 psycopg 直接报错。
      - run: python -m pip install -e '.[dev,postgres]'
      - run: python -m pytest -q
      - name: 联调脚本回归测试
        working-directory: .
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: 部署自检（表结构、迁移往返、离线 SQL）
        working-directory: .
        run: |
          python -m pip install -r deploy/requirements.txt
          python deploy/verify.py

  api-contract:
    needs: changes
    if: needs.changes.outputs.api_contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: 校验契约可解析、版本与路径齐备
        run: |
          python -c "
          import yaml
          with open('packages/api-contract/openapi.yaml', encoding='utf-8') as f:
              doc = yaml.safe_load(f)
          assert str(doc['openapi']).startswith('3.1.'), doc.get('openapi')
          assert 'info' in doc and 'servers' in doc
          paths = doc.get('paths') or {}
          assert len(paths) > 0, 'paths 不能为空'
          print(f'openapi ok: {len(paths)} paths')
          "

  # 真库联调：起 PostgreSQL → 迁移到 head → 写演示数据 → 起服务 → 跑 28 个操作的冒烟。
  #
  # 为什么要单独一个 job：其余 job 用的是 SQLite，PostgreSQL 特有的东西（JSONB、序列、
  # 约束名长度、迁移脚本里的原生 SQL）在那边根本走不到。契约联调此前**只在本机跑过**。
  integration:
    needs: changes
    if: >-
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.api_contract == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rehab
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rehab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 仅 CI 使用的临时口令，与生产无关。
      REHAB_DATABASE_URL: postgresql+psycopg://rehab:ci-only-password@127.0.0.1:5432/rehab
      REHAB_JWT_SECRET: ci-only-secret-not-for-production
      REHAB_MEDIA_ROOT: /tmp/rehab-media
      REHAB_AUTO_CREATE_SCHEMA: "false"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e 'services/api[dev,postgres]' -r deploy/requirements.txt

      - name: 迁移到 head
        run: alembic -c deploy/alembic.ini upgrade head

      - name: 写演示数据
        working-directory: services/api
        run: python -m app.seed

      - name: 起服务并等就绪
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz > /dev/null; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "服务 60 秒内未就绪"
          exit 1

      - name: 契约联调（28 个操作）
        run: |
          # 演示凭据来自 app/seed.py，仅 CI 临时库使用。
          cat > /tmp/smoke-config.json <<'JSON'
          {"username": "therapist", "password": "therapist123", "bindingToken": "demo-binding-token"}
          JSON
          python scripts/smoke-api.py --config /tmp/smoke-config.json             --base-url http://127.0.0.1:8000/v1
