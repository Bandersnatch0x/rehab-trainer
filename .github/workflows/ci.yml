# GitHub Actions CI。仓库当前没有 GitHub 远端，本文件未在真实流水线验证。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      miniprogram: ${{ steps.filter.outputs.miniprogram }}
      admin_web: ${{ steps.filter.outputs.admin_web }}
      api: ${{ steps.filter.outputs.api }}
      api_contract: ${{ steps.filter.outputs.api_contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'apps/android/**'
            miniprogram:
              - 'apps/miniprogram/**'
            admin_web:
              - 'apps/admin-web/**'
            api:
              - 'services/api/**'
              - 'packages/api-contract/**'
              - 'scripts/**'
            api_contract:
              - 'packages/api-contract/**'
              - 'packages/api-client-ts/**'
              - 'packages/api-client-kt/**'

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 默认 packages 含 legacy 的 `tools`，它在现代 SDK 仓库里已不存在，会让这一步 exit 1；
      # 只留 platform-tools，需要什么再用 sdkmanager 显式装。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - run: ./gradlew :app:testDebugUnitTest --no-daemon

  miniprogram:
    needs: changes
    if: needs.changes.outputs.miniprogram == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @rehab-trainer/miniprogram typecheck
      - run: pnpm --filter @rehab-trainer/miniprogram test
      - name: 小程序静态一致性（页面/绑定/D20）
        working-directory: apps/miniprogram
        run: python tests/static_check.py .

  admin-web:
    needs: changes
    if: needs.changes.outputs.admin_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @rehab-trainer/admin-web build

  generated:
    # 只改契约时也必须跑：否则两份生成物会静默漂移。
    needs: changes
    if: >-
      needs.changes.outputs.api_contract == 'true' ||
      needs.changes.outputs.admin_web == 'true' ||
      needs.changes.outputs.miniprogram == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: 生成物必须与契约一致
        run: |
          pnpm --filter @rehab-trainer/admin-web generate:api
          pnpm --filter @rehab-trainer/miniprogram generate:api
          git diff --exit-code -- apps/admin-web/src/api/schema.d.ts apps/miniprogram/types/api.d.ts

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # postgres extra 也要装：test_database_pool 会构造 postgres 方言引擎，缺 psycopg 直接报错。
      - run: python -m pip install -e '.[dev,postgres]'
      - run: python -m pytest -q
      - name: 联调脚本回归测试
        working-directory: .
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: 部署自检（表结构、迁移往返、离线 SQL）
        working-directory: .
        run: |
          python -m pip install -r deploy/requirements.txt
          python deploy/verify.py

  api-contract:
    needs: changes
    if: needs.changes.outputs.api_contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: 校验契约可解析、版本与路径齐备
        run: |
          python -c "
          import yaml
          with open('packages/api-contract/openapi.yaml', encoding='utf-8') as f:
              doc = yaml.safe_load(f)
          assert str(doc['openapi']).startswith('3.1.'), doc.get('openapi')
          assert 'info' in doc and 'servers' in doc
          paths = doc.get('paths') or {}
          assert len(paths) > 0, 'paths 不能为空'
          print(f'openapi ok: {len(paths)} paths')
          "
