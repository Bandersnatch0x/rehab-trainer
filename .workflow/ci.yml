# Gitee Go 流水线。
#
# 为什么先只有一段：Gitee Go 的 schema 我拿不到权威文档可核对（help.gitee.com 相关页 404，
# 本仓库此前也没有 .workflow 可参照），所以先只放两步最不容易写错的——解析契约、跑后端测试与部署自检。
# 它跑通了再往上加管理端、小程序、Android；否则一整套写错时，分不清是 schema 错还是步骤错。
#
# 与 .github/workflows/ci.yml 的关系：那边是 GitHub Actions 格式，Gitee 不执行它。
# 两份并存时，步骤口径以 scripts/verify_all.py 与 GitHub 那份为准，别各跑一套。
#
# 已知风险：项目要求 Python >= 3.13（services/api/pyproject.toml），若 Gitee Go 的
# build@python 不提供 3.13，pip 安装会直接失败——那不是配置写错，是运行环境不满足，需要换方案。
version: 1.0

name: ci

displayName: 契约自检与后端测试

triggers:
  push:
    branches:
      include:
        - main
  pr:
    branches:
      include:
        - main

stages:
  - stage:
      name: verify
      displayName: 契约与后端
      steps:
        - step: build@python
          name: contract
          displayName: 契约可解析
          pythonVersion: "3.13"
          commands:
            - python -m pip install --upgrade pip
            - python -m pip install 'pyyaml>=6.0,<7.0'
            - |
              python -c "
              import yaml
              with open('packages/api-contract/openapi.yaml', encoding='utf-8') as f:
                  doc = yaml.safe_load(f)
              assert str(doc['openapi']).startswith('3.1.'), doc.get('openapi')
              assert 'info' in doc and 'servers' in doc
              paths = doc.get('paths') or {}
              assert len(paths) > 0, 'paths 不能为空'
              print(f'openapi ok: {len(paths)} paths')
              "

        - step: build@python
          name: backend
          displayName: 后端测试与部署自检
          pythonVersion: "3.13"
          commands:
            - python -m pip install --upgrade pip
            # 与 GitHub 那份同口径：dev extra 供 pytest/httpx/pyyaml，alembic 供 deploy/verify.py。
            - python -m pip install -e 'services/api[dev]' -r deploy/requirements.txt
            - python -m pytest -q services/api/tests
            - python -m unittest discover -s scripts -p 'test_*.py'
            - python deploy/verify.py
