<body class="bg-background text-on-surface h-full flex flex-col font-body-md select-none overflow-hidden antialiased">
<!-- ==================== 1. 顶部紧凑状态栏与导航条 ==================== -->
<header class="w-full bg-surface-container-lowest z-40 px-margin pt-3 pb-2 shadow-sm border-b border-outline-variant flex items-center justify-between flex-shrink-0">

<div>

</div>
<h1 class="font-headline-sm text-headline-sm text-primary tracking-tight">坐位律动舒展</h1>
</div>
</div>
<!-- 右侧：RAS节律指示器与广播语音切换 -->
<div class="flex items-center gap-2">

<span class="relative inline-flex rounded-full h-3 w-3 bg-secondary"></span>
</span>

<span class="material-symbols-outlined text-[28px]">volume_up</span>
</button>
</div>
</header>
<!-- 主体工作区：上下双视窗结构 (单轴防误触网格) -->
<main class="flex-1 flex flex-col px-margin py-2 gap-2 overflow-hidden">

<line stroke="#9cf2e8" stroke-linecap="round" stroke-width="4" x1="200" x2="260" y1="85" y2="95"></line>

<span class="font-headline-xl text-headline-xl text-primary font-black tracking-tight leading-none">8</span>
<span class="font-headline-sm text-headline-sm text-outline font-bold">/ 12 次</span>
</div>
<!-- 达标度状态 -->
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined-fill text-secondary text-[22px]">check_circle</span>
<div>
<div class="flex items-baseline gap-1">
<span class="font-headline-sm text-headline-sm text-secondary font-extrabold leading-none">96%</span>
<span class="font-label-md text-label-md text-secondary font-bold">极佳幅度</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant mt-0.5">关节开合 ROM 85°</p>
</div>
</div>
</div>
<!-- 右上角悬浮控制按钮列 (大触控靶点) -->
<div class="flex flex-col gap-2">
<!-- RAS 节拍波形律动开关 -->
<button class="bg-surface-container-lowest/95 backdrop-blur-md text-primary px-3 py-2 rounded-xl border border-primary shadow-sm flex items-center gap-2 active:scale-95 transition-all" type="button">
<div class="flex items-end gap-0.5 h-5 w-4 justify-center">
<span class="w-1 bg-secondary rounded-full sound-bar-1"></span>
<span class="w-1 bg-secondary rounded-full sound-bar-2"></span>
<span class="w-1 bg-secondary rounded-full sound-bar-3"></span>
</div>
<span class="font-label-md text-label-md font-bold">律动音开启</span>
</button>
<!-- 骨骼显隐切换按钮 -->
<button class="bg-surface-container-lowest/95 backdrop-blur-md text-on-surface px-3 py-2 rounded-xl border border-outline-variant shadow-sm flex items-center gap-1.5 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px] text-primary">accessibility_new</span>
<span class="font-label-md text-label-md font-bold">姿态标线</span>
</button>
</div>
</div>
<!-- 画面最下沿柔和安全状态条 (置于画面底边，杜绝遮挡面部) -->
<div class="relative z-10 w-full px-2.5 pb-2">

<!-- 左侧：大圆角次级按钮 (暂停/休息片刻，倒计时建议) -->
<button class="flex-1 min-h-[64px] bg-surface-container-low hover:bg-surface-container border-2 border-outline-variant text-primary rounded-2xl flex flex-col items-center justify-center p-2 active:scale-95 transition-all" type="button">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[24px]">pause_circle</span>
<span class="font-label-xl text-label-xl font-bold">稍事休息</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant font-medium">建议放松 30秒</span>
</button>
<!-- 中间：饱满的圆角主按钮 (完成本组，进入下一节) -->

<!-- 轻量交互与可访问性防抖脚本 -->
<script>

    let isPlaying = true;
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('touchstart', () => {}, {passive: true});
